apiVersion: apps/v1
kind: Deployment
metadata:
  name: dciapp-nixlcomm-conn-4z
  namespace: dci
  labels:
    app.kubernetes.io/name: dciapp-nixlcomm-conn-4z
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: connection
      app.kubernetes.io/name: dciapp-nixlcomm-conn-4z
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: demo-network2
      labels:
        app: connection
        app.kubernetes.io/name: dciapp-nixlcomm-conn-4z
    spec:
      serviceAccountName: app-conn-ctrl-info-mng-dci-controller-manager
      shareProcessNamespace: true
      containers:
        - name: sample-nixlcomm
          image: ${HARBOR_TNT}:30003/tntuser/sample-nixlcomm:${TAG_COMMON}
          imagePullPolicy: IfNotPresent
          command: ["python3", "client.py", "DRAM", "READ"]
          env:
            - name: USE_DNS
              value: "false"
            - name: NVIDIA_VISIBLE_DEVICES
              value: ""
          securityContext:
            capabilities:
              add: ["NET_RAW", "IPC_LOCK"]
          ports:
            - containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: pod-volume-config
              mountPath: /app-conn-control-info-manager-dci
          resources:
            claims:
              - name: mig-device
                request: mig-1g-10gb
            requests:
              nvidia.com/sriov_rdma: 1
            limits:
              cpu: 4000m
              memory: 4000M
              nvidia.com/sriov_rdma: 1
      initContainers:
        - name: app-conn-control-info-manager-dci
          image: ${HARBOR_TNT}:30003/offerings/app-conn-control-info-manager-dci:${TAG_TENANT}
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAIN_CONTAINER_PROCESS_NAME
              value: "client.py"
          resources:
            limits:
              cpu: 60m
              memory: 200Mi
          securityContext:
            capabilities:
              add: ["SYS_PTRACE"]
          volumeMounts:
            - name: pod-volume-config
              mountPath: /app-conn-control-info-manager-dci
            - name: pod-volume-tmp
              mountPath: /tmp/app-conn-control-info-manager-dci
          restartPolicy: Always
        - name: vector
          image: docker.io/timberio/vector:0.52.0-debian
          command: ["vector"]
          args:
            - "--config"
            - "/etc/vector/vector.toml"
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health/live
              port: 9590
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health/ready
              port: 9590
            initialDelaySeconds: 10
            periodSeconds: 10
          ports:
            - containerPort: 9588
              protocol: TCP
          resources:
            limits:
              cpu: 60m
              memory: 1350Mi
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_APP_LABEL
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: VECTOR_LOG
              value: "debug"
          volumeMounts:
            - name: vector-sidecar-config
              mountPath: /etc/vector
          restartPolicy: Always
      volumes:
        - name: vector-sidecar-config
          configMap:
            name: vector-sidecar-config
        - name: pod-volume-config
          emptyDir: {}
        - name: pod-volume-tmp
          emptyDir: {}
      resourceClaims:
        - name: mig-device
          resourceClaimTemplateName: mig-devices-a100
      nodeSelector:
        kubernetes.io/hostname: ${K8S_NODE_01} #K8s Node 01

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixl-communicator-composed-1-cuda
  namespace: dci
  labels:
    app.kubernetes.io/name: nixl-communicator-composed-1-cuda
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nixl-communicator-composed-1-cuda
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: demo-network1
      labels:
        app.kubernetes.io/name: nixl-communicator-composed-1-cuda
    spec:
      serviceAccountName: default
      shareProcessNamespace: true
      containers:
      - name: test-container
        image: 10.10.0.30:30003/apfw/nixl-communicator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: USE_DNS
          value: "false"
        securityContext:
          capabilities:
            add: ["NET_RAW", "IPC_LOCK"]
        ports:
        resources:
          claims:
          - name: mig-device
            request: mig-1g-10gb
          requests:
            nvidia.com/sriov_rdma_15b3: 1
            rdma/rdma_shared_device_15b3: 1
          limits:
            nvidia.com/sriov_rdma_15b3: 1
            rdma/rdma_shared_device_15b3: 1
      resourceClaims:
      - name: mig-device
        resourceClaimTemplateName: mig-devices-h100
      nodeSelector:
        kubernetes.io/hostname: 09e7e5ea-1a1a-4eb9-aae1-8e7035955836.maas

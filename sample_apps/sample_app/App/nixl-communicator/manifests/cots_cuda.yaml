apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixl-communicator-cots-cuda
  namespace: dci
  labels:
    app.kubernetes.io/name: nixl-communicator-cots-cuda
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nixl-communicator-cots-cuda
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: demo-network1
      labels:
        app.kubernetes.io/name: nixl-communicator-cots-cuda
    spec:
      serviceAccountName: default
      shareProcessNamespace: true
      containers:
      - name: test-container
        image: 10.10.0.30:30003/apfw/nixl-communicator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: USE_DNS
          value: "false"
        securityContext:
          capabilities:
            add: ["NET_RAW", "IPC_LOCK"]
        ports:
        resources:
          claims:
          - name: t4-device
            request: t4
          requests:
            nvidia.com/sriov_rdma_15b3: 1
            rdma/rdma_shared_device_15b3: 1
          limits:
            nvidia.com/sriov_rdma_15b3: 1
            rdma/rdma_shared_device_15b3: 1
      resourceClaims:
      - name: t4-device
        resourceClaimTemplateName: t4-gpu-claim
      nodeSelector:
        kubernetes.io/hostname: 222611ab-f428-4032-97d0-28917f283825.maas

apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  nvIpam:
    enableWebhook: false
    image: nvidia-k8s-ipam
    imagePullSecrets: []
    repository: ghcr.io/mellanox
    version: v0.3.7
  ofedDriver:
    env:
    - name: http_proxy
      value: http://proxy.example.net:8080
    - name: https_proxy
      value: http://proxy.example.net:8080
    - name: no_proxy
      value: 127.0.0.1,localhost,192.0.2.0/24
    forcePrecompiled: false
    image: doca-driver
    imagePullSecrets: []
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
    repository: nvcr.io/nvidia/mellanox
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 20
    terminationGracePeriodSeconds: 300
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        podSelector: ""
        timeoutSeconds: 300
      maxParallelUpgrades: 1
      safeLoad: false
    version: 25.01-0.6.0.0-0
  rdmaSharedDevicePlugin:
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_device_a",
            "rdmaHcaMax": 63,
            "selectors": {
              "vendors": ["15b3"],
              "deviceIDs": [],
              "drivers": [],
              "ifNames": [],
              "linkTypes": []
            }
          }
        ]
      }
    image: k8s-rdma-shared-dev-plugin
    imagePullSecrets: []
    repository: ghcr.io/mellanox
    version: v1.5.3
  secondaryNetwork:
    ipamPlugin:
      image: whereabouts
      imagePullSecrets: []
      repository: ghcr.io/k8snetworkplumbingwg
      version: v0.7.0
    multus:
      image: multus-cni
      imagePullSecrets: []
      repository: ghcr.io/k8snetworkplumbingwg
      version: v4.1.0
  sriovDevicePlugin:
    config: |
      {
        "resourceList": [
          {
            "resourcePrefix": "nvidia.com",
            "resourceName": "sriov_rdma_wb-tc06",
            "selectors": {
              "vendors": ["15b3"],
              "devices": ["1017", "1018"],
              "drivers": ["mlx5_core"],
              "pfNames": [],
              "pciAddresses": [],
              "rootDevices": [],
              "linkTypes": []
            }
          },{
            "resourcePrefix": "nvidia.com",
            "resourceName": "sriov_rdma_wb-tc05",
            "selectors": {
              "vendors": ["15b3"],
              "devices": ["101d", "101e"],
              "drivers": ["mlx5_core"],
              "pfNames": [],
              "pciAddresses": [],
              "rootDevices": [],
              "linkTypes": []
            }
          }
        ]
      }
    image: sriov-network-device-plugin
    imagePullSecrets: []
    repository: ghcr.io/k8snetworkplumbingwg
    version: v3.9.0

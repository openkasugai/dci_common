apiVersion: v1
kind: Pod
metadata:
  name: dciapp-perftest-conn-x2
  namespace: dci
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [{
        "name": "demo-network1",
        "ips": ["192.0.2.199/24"]
      }]
spec:
  shareProcessNamespace: true
  containers:
  - name: sample-app
    image: localhost/sample-app:ut
    imagePullPolicy: Never
    command: ["python3", "client.py", "DRAM", WRITE]
    env:
    - name: USE_DNS
      value: "false"
    securityContext:
      capabilities:
        add: ["NET_RAW", "IPC_LOCK"]
    volumeMounts:
    - name: pod-volume-config
      mountPath: /app-conn-control-info-manager-dci
    resources:
      claims:
      - name: mig-device
        request: mig-1g-10gb
      requests:
        nvidia.com/sriov_rdma_15b3: 1
        rdma/rdma_shared_device_15b3: 1
      limits:
        nvidia.com/sriov_rdma_15b3: 1
        rdma/rdma_shared_device_15b3: 1
    livenessProbe:
      httpGet:
        path: /health/live
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health/ready
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
  resourceClaims:
  - name: mig-device
    resourceClaimTemplateName: mig-devices
  volumes:
  - name: pod-volume-config
    emptyDir: {}
  nodeSelector:
    kubernetes.io/hostname: 333611ab-f428-4032-97d0-28917f283825.maas

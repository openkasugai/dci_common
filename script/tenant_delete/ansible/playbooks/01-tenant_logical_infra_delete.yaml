- name: テナント論理インフラ削除
  hosts: all
  vars:
    play_description: |
      A7 - テナント論理インフラ削除
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  tasks:
    - name: テナント論理インフラ削除
      ansible.builtin.command:
        cmd: "kubectl delete cluster -n {{ item.tenant_namespace }} {{ item.tenant_name }} --ignore-not-found"
      register: tenant_delete_result
      changed_when: "'deleted' in tenant_delete_result.stdout"
      loop: "{{ tenants }}"

    - name: テナント論理インフラ削除完了待機
      ansible.builtin.command:
        cmd: "kubectl wait --for=delete cluster/{{ item.tenant_name }} -n {{ item.tenant_namespace }} --timeout=1800s"
      register: tenant_delete_wait_result
      changed_when: false
      failed_when:
        - tenant_delete_wait_result.rc != 0
        - '"not found" not in tenant_delete_wait_result.stderr'
      loop: "{{ tenants }}"

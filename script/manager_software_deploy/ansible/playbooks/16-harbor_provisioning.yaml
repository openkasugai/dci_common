  ## Temporal
    - name: Harbor上のtemporal-workflowイメージ存在確認
      ansible.builtin.include_role:
        name: harbor_image_check
      vars:
        component_name: "temporal-workflow"
        harbor_url: "{{ harbor_manager_url }}"
        harbor_port: "{{ harbor_manager_port }}"
        harbor_user: "{{ harbor_manager_user }}"
        harbor_password: "{{ harbor_manager_password }}"
        harbor_project: "{{ harbor_project_tenant_infrastructure }}"
        repository_name: "{{ temporal_workflow_image }}"
        version_tag: "{{ tag_tenant_version }}"
        rebuild_flag: "{{ temporal_rebuild }}"
        fact_variable_name: "harbor_temporal_image_exists"

    - name: TemporalのDockerfileにプロキシ設定を追記
      ansible.builtin.include_role:
        name: dockerfile_proxy_config
      vars:
        dockerfile_paths:
          - "{{ temporal_base_path }}/workflow/Dockerfile"
          - "{{ temporal_base_path }}/gateway/Dockerfile"
          - "{{ temporal_base_path }}/client/Dockerfile"

    - name: Temporalイメージをbuildahでビルド
      become: true
      ansible.builtin.shell: >
        buildah bud -t {{ harbor_manager_url }}:{{ harbor_manager_port }}/{{ harbor_project_tenant_infrastructure }}/{{ item.image }}:{{ tag_tenant_version }} -f {{ item.dockerfile }}
      args:
        chdir: "{{ temporal_base_path }}"
        executable: /bin/bash
      loop:
        - { image: "{{ temporal_workflow_image }}", dockerfile: "workflow/Dockerfile" }
        - { image: "{{ temporal_gateway_image }}", dockerfile: "gateway/Dockerfile" }
        - { image: "{{ temporal_client_image }}", dockerfile: "client/Dockerfile" }
      loop_control:
        label: "Building {{ item.image }}:{{ tag_tenant_version }}"
      register: buildah_build_results
      retries: 3
      delay: 15
      until: buildah_build_results.rc == 0
      changed_when: true
      failed_when:
        - buildah_build_results.rc != 0
        - "'connection refused' not in buildah_build_results.stderr | default('') | lower"
        - "'timeout' not in buildah_build_results.stderr | default('') | lower"
      when: >
        temporal_rebuild | bool 
        or not harbor_temporal_image_exists | default(false)

    - name: TemporalイメージをHarborにプッシュ
      become: true
      ansible.builtin.shell: >
        buildah push {{ harbor_manager_url }}:{{ harbor_manager_port }}/{{ harbor_project_tenant_infrastructure }}/{{ item.image }}:{{ tag_tenant_version }}
      loop:
        - { image: "{{ temporal_workflow_image }}" }
        - { image: "{{ temporal_gateway_image }}" }
        - { image: "{{ temporal_client_image }}" }
      loop_control:
        label: "Pushing {{ item.image }}:{{ tag_tenant_version }}"
      register: buildah_push_results
      retries: 3
      delay: 10
      until: buildah_push_results.rc == 0
      changed_when: true
      failed_when:
        - buildah_push_results.rc != 0
        - "'connection refused' not in buildah_push_results.stderr | default('') | lower"
        - "'timeout' not in buildah_push_results.stderr | default('') | lower"
      when: >
        buildah_build_results is changed 
        or (temporal_rebuild | bool 
            or not harbor_temporal_image_exists | default(false))

    - name: 既存のTemporal Helmチャートディレクトリを削除
      ansible.builtin.file:
        path: "{{ temporal_base_path }}/temporal"
        state: absent
      when: >
        buildah_build_results is changed
        or (temporal_rebuild | bool
            or not harbor_temporal_image_exists | default(false))

    - name: Temporal Helmチャートを取得
      ansible.builtin.shell: >
        helm pull temporal --repo https://go.temporal.io/helm-charts/ --version {{ temporal_chart_version }} --untar
      args:
        chdir: "{{ temporal_base_path }}"
        executable: /bin/bash
      register: temporal_helm_pull_result
      changed_when: temporal_helm_pull_result.rc == 0
      failed_when:
        - temporal_helm_pull_result.rc != 0
      when: >
        buildah_build_results is changed
        or (temporal_rebuild | bool
            or not harbor_temporal_image_exists | default(false))

    - name: Temporal Helmチャートにパッチを適用
      ansible.builtin.shell: >
        patch -p1 < ../temporal-chart.patch
      args:
        chdir: "{{ temporal_base_path }}/temporal"
        executable: /bin/bash
      register: temporal_patch_result
      changed_when: temporal_patch_result.rc == 0
      failed_when:
        - temporal_patch_result.rc != 0
      when: >
        temporal_helm_pull_result is defined
        and not temporal_helm_pull_result.skipped | default(false)
        and temporal_helm_pull_result.rc == 0

    - name: Temporal Helmチャートパッケージ作成
      ansible.builtin.shell: >
        helm package ./temporal
      args:
        chdir: "{{ temporal_base_path }}"
        executable: /bin/bash
      register: temporal_helm_package_result
      changed_when: 
        - temporal_helm_package_result.rc == 0
        - "'Successfully packaged chart' in temporal_helm_package_result.stdout"
      failed_when: 
        - temporal_helm_package_result.rc != 0
      when: >
        buildah_build_results is changed 
        or (temporal_rebuild | bool 
            or not harbor_temporal_image_exists | default(false))

    - name: Temporal HelmチャートをHarborにプッシュ
      ansible.builtin.shell: >
        helm push temporal-{{ temporal_chart_version }}.tgz oci://{{ harbor_manager_url }}:{{ harbor_manager_port }}/{{ harbor_project_tenant_infrastructure }}/
      args:
        chdir: "{{ temporal_base_path }}"
        executable: /bin/bash
      register: temporal_helm_push_result
      changed_when: temporal_helm_push_result.rc == 0
      failed_when:
        - temporal_helm_push_result.rc != 0
      when:
        - temporal_helm_package_result is defined
        - temporal_helm_package_result.changed

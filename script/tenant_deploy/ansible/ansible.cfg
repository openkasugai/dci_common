[defaults]
# インベントリファイルのパス
inventory = ./inventory/hosts

# YAML形式で出力
stdout_callback = default

host_key_checking = False

# デフォルトの詳細度(タスクの入力/出力まで)★本番用
verbosity = 2
# 実行コマンドまで表示★試験用
#verbosity = 3

# カスタムコールバックプラグインのパス
callback_plugins = ./callback_plugins
# 使用するカスタムコールバックプラグインの指定
callbacks_enabled = custom_logger

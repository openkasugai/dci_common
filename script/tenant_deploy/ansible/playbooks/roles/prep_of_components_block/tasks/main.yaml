# 監視関連OSSの配備
- name: マネージャクラスタにhelm-repo-ca secretを作成
  ansible.builtin.shell: |
    kubectl create secret generic helm-{{ tenant_namespace }}-repo-ca \
      --from-file=ca.crt={{ tenant_work_dir }}/{{ harbor_ca_file }} \
      -n {{ tenant_namespace }}
  register: create_monitoring_ca_secret_result
  failed_when:
    - create_monitoring_ca_secret_result.rc != 0
    - '"already exists" not in create_monitoring_ca_secret_result.stderr'
  changed_when: create_monitoring_ca_secret_result.rc == 0

- name: 監視配備のためテナントクラスタにラベル付与

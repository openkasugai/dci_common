## DCI診断ツール 設定ファイル
## 診断ツールの動作設定を定義します

# Pod異常検出の閾値設定
pod_restart_threshold: 50  # Pod再起動回数の警告閾値（この回数を超えると警告）

# 詳細情報収集の設定
collect_details_for_warnings: true  # warningレベルで詳細情報（ログ、describe等）を収集するか
collect_details_for_critical: true   # criticalレベルで詳細情報を収集するか

# 異常の深刻度設定
pod_not_ready_severity: warning      # PodNotReady状態の深刻度（warning/critical）
high_restart_severity: warning       # HighRestartCountの深刻度（warning/info/ignore）

# Ansibleログエラー検出設定
ansible_log_error_detection:
  # 重大エラーとして検出するパターン（正規表現）
  critical_patterns:
    - "STATUS: FAILED"  # Ansibleタスク失敗
  
  # 警告として検出するパターン（正規表現）
  warning_patterns:
    - "ERROR:"          # 一般的なエラーメッセージ
    - "error:"          # 小文字のエラー
    - "FAILED!"         # Ansible失敗インジケーター
    - "fatal:"          # 致命的エラー
    - "failed=\\d+"     # 失敗カウント
    - "WARNING:"        # 警告メッセージ
    - "warning:"        # 小文字の警告
    - "\\[WARN\\]"       # WARN形式
    - "deprecated"      # 非推奨機能の使用
  
  # エラー情報にSTDERR全文を含めるか
  include_stderr_in_errors: true

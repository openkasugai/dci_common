[defaults]
# 診断ツール専用ansible.cfg
# JSON出力を確実にするためのシンプルな設定

# デフォルトの出力形式（環境変数ANSIBLE_STDOUT_CALLBACK=jsonで上書き）
stdout_callback = default

# SSH接続時のホストキーチェックを無効化
host_key_checking = False

# 詳細度 (本番環境では0推奨、試験中は3)
verbosity = 0

# SSH接続設定
[ssh_connection]
# SSH接続タイムアウト
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True

# 注意: 以下の設定は意図的に含めない
# - inventory: 実行時に-iオプションで自動化スクリプトのinventoryを指定
# - callback_plugins: カスタムコールバックプラグインは使用しない
# - callbacks_enabled: 環境変数ANSIBLE_STDOUT_CALLBACK=jsonを優先させるため

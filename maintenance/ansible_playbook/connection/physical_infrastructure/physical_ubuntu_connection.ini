# Connection information for Physical-infrastructure Ubuntu machines
# Parent group names, child group names, and host names must be unique
# Names must be unique across other connection information files as well

# Parent group name:"phys_infra_ubuntu_targets"
[phys_infra_ubuntu_targets:children]
phys_infra_ubuntu_01_child


[phys_infra_ubuntu_01_child]
# Connection hosts
phys_infra_ubuntu_01 ansible_host=111.111.111.111

[phys_infra_ubuntu_01_child:vars]
# Connection user
ansible_user=user
# Connection password
ansible_password=password
# User switch command
ansible_become_method=sudo
# Target user for switching
ansible_become_user=root
# Password for the target user
ansible_become_password=password

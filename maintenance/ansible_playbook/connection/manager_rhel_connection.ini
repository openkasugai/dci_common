# Connection information for DCI-manager RHEL machines
# Parent group names, child group names, and host names must be unique
# Names must be unique across other connection information files as well

# Parent group name:"manager_rhel_targets"
[manager_rhel_targets:children]
manager_rhel_01_child


[manager_rhel_01_child]
# Connection hosts
manager_rhel_01 ansible_host=111.111.111.111

[manager_rhel_01_child:vars]
# Connection user
ansible_user=user
# Connection password
ansible_password=password
# User switch command
ansible_become_method=sudo
# Target user for switching
ansible_become_user=root
# Password for the target user
ansible_become_password=password

